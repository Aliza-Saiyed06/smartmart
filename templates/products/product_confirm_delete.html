{% extends 'base.html' %}

{% block title %}Delete {{ product.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-trash3 text-danger fs-1"></i>
                <h1 class="h4 mt-2">Delete this product?</h1>
                <p class="mb-1">You are about to delete <strong>{{ product.name }}</strong>.</p>
                <p class="text-muted small">This cannot be undone. Products that already appear in past sales cannot be deleted.</p>

                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'product_detail' product.pk %}" class="btn btn-outline-secondary ms-1">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
